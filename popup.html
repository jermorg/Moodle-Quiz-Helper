<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodle Quiz Helper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="app-header">
        <div class="app-title-row">
            <span class="app-dot"></span>
            <h1 class="app-title">Moodle Helper</h1>
        </div>
        <span class="app-badge">NUPP</span>
    </header>

    <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-target="dbPanel">База відповідей</button>
        <button type="button" class="tab" data-target="parsePanel">Парсер сторінки</button>
    </nav>

    <!-- Вкладка 1: Вставка JSON у фонову базу -->
    <main id="dbPanel" class="panel active">
        <section class="card">
            <label for="jsonInput" class="section-label">Імпорт JSON</label>
            <textarea id="jsonInput" placeholder="Вставте сюди JSON з парсера..."></textarea>

            <div class="btn-group">
                <button type="button" id="saveBtn" class="btn btn-primary green">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
                    <span>Зберегти в базу</span>
                </button>
                <div class="btn-row">
                    <button type="button" id="exportBtn" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 17l4 4 4-4M12 12v9M20.88 18.09A5 5 0 0018 9h-1.26A8 8 0 103 16.29"/></svg>
                        <span>Експорт</span>
                    </button>
                    <button type="button" id="clearBtn" class="btn btn-danger red">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
                        <span>Очистити</span>
                    </button>
                </div>
            </div>
        </section>

        <div class="status-card">
            <span class="status-indicator"></span>
            <div id="dbStatus" class="status">База порожня.</div>
        </div>
    </main>

    <!-- Вкладка 2: Парсер -->
    <main id="parsePanel" class="panel">
        <section class="card">
            <div class="btn-row">
                <button type="button" id="parseBtn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
                    <span>Зпарсити тест</span>
                </button>
                <button type="button" id="copyBtn" class="btn btn-success green" style="display: none;">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3"/></svg>
                    <span>Копіювати</span>
                </button>
            </div>

            <div class="status-inline">
                <div id="parseStatus" class="status">Відкрийте сторінку результатів (review.php) та натисніть «Зпарсити тест».</div>
            </div>

            <pre id="parseOutput"></pre>
        </section>
    </main>

    <script src="libs/jquery.min.js"></script>
    <script type="module" src="parser/parser.js"></script>
    <script type="module" src="parser/parser-ui.js"></script>
    <script src="popup.js"></script>
</body>
</html>
