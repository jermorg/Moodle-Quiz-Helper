<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 400px;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            color: #202124;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #dadce0;
            margin-bottom: 10px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #5f6368;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        button {
            flex: 1;
            padding: 9px 6px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover {
            background: #1557b0;
        }
        button.green {
            background: #188038;
        }
        button.green:hover {
            background: #137333;
        }
        button.red {
            background: #d93025;
        }
        button.red:hover {
            background: #b3261e;
        }
        textarea {
            width: 100%;
            height: 155px;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #dadce0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            resize: vertical;
            margin-bottom: 8px;
        }
        pre {
            margin: 0;
            max-height: 230px;
            overflow-y: auto;
            background: #f1f3f4;
            padding: 8px;
            border-radius: 5px;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .status {
            font-size: 12px;
            color: #5f6368;
            margin-bottom: 6px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="tabs">
        <div class="tab active" data-target="dbPanel">База відповідей (фон)</div>
        <div class="tab" data-target="parsePanel">Зпарсити сторінку</div>
    </div>

    <!-- Вкладка 1: Вставка JSON у фонову базу -->
    <div id="dbPanel" class="panel active">
        <textarea id="jsonInput" placeholder="Вставте сюди JSON з парсера..."></textarea>
        <div class="btn-row">
        <button id="saveBtn" class="green">Зберегти в базу</button>
        <button id="exportBtn">Експорт бази</button>
        <button id="clearBtn" class="red">Очистити</button>
        </div>
        <div id="dbStatus" class="status">База порожня.</div>
    </div>

    <!-- Вкладка 2: Парсер -->
    <div id="parsePanel" class="panel">
        <div class="btn-row">
        <button id="parseBtn">Зпарсити тест</button>
        <button id="copyBtn" class="green" style="display: none;">Копіювати JSON</button>
        </div>
        <div id="parseStatus" class="status">Відкрийте сторінку результатів (review.php) та натисніть «Зпарсити тест».</div>
        <pre id="parseOutput"></pre>
    </div>

    <script src="libs/jquery.min.js"></script>

    <script type="module" src="parser/parser.js"></script>
    <script type="module" src="parser/parser-ui.js" ></script>
    <script src="popup.js"></script>
</body>
</html>
