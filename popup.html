<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <header>
    <h1>Moodle Quiz Helper</h1>
    <span id="connPill" class="conn-pill">Офлайн</span>
  </header>

  <!-- <div class="tabs">
    <div class="tab active" data-target="syncPanel">Сервер</div>
    <div class="tab" data-target="parsePanel">Парсер</div>
  </div> -->

  <!-- Вкладка 1: Синхронізація із сервером -->
  <div id="syncPanel" class="panel active">
    <div class="stats-grid">
      <div class="stat-card">
        <div id="statQuestions" class="stat-value">0</div>
        <div class="stat-label">Питань у базі</div>
      </div>
      <div class="stat-card">
        <div id="statTests" class="stat-value">0</div>
        <div class="stat-label">Тестів прив'язано</div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label for="serverUrl">Адреса сервера (API URL)</label>
        <input type="text" id="serverUrl" placeholder="https://api.example.com">
      </div>
      <div class="field">
        <label for="apiToken">Секретний токен (Token)</label>
        <input type="password" id="apiToken" placeholder="Введіть API_TOKEN...">
      </div>
      <div class="btn-row">
        <button id="connectBtn" class="green">Підключити і синхронізувати</button>
      </div>
    </div>

    <div class="btn-row">
      <button id="forceSyncBtn" class="outline">Оновити з сервера</button>
      <button id="disconnectBtn" class="red" style="flex: 0.45;">Вийти</button>
    </div>

    <div id="syncStatus" class="status-box">
      Введіть адресу сервера та токен для автоматичної синхронізації відповідей.
    </div>
  </div>

  <!-- Вкладка 2: Ручний парсинг -->
  <div id="parsePanel" class="panel">
    <div class="btn-row" style="margin-top: 0;">
      <button id="parseBtn">Зпарсити сторінку</button>
      <button id="pushParsedBtn" class="green" style="display: none;">На сервер</button>
      <button id="copyBtn" class="outline" style="display: none; flex: 0.6;">Копіювати</button>
    </div>
    <div id="parseStatus" class="status-box">
      На сторінці результатів (review.php) відправка на сервер працює автоматично. Тут можна перевірити парсер вручну.
    </div>
    <pre id="parseOutput" style="display: none;"></pre>
  </div>

  <script src="libs/jquery.min.js"></script>
  <script type="module" src="ui.js"></script>
</body>
</html>
