<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moodle Quiz Sync</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <header class="app-header">
    <div id="connPill" class="conn-pill">
      <span class="conn-dot"></span>
      <span id="connText">Офлайн</span>
    </div>

    <button type="button" id="settingsToggleBtn" class="icon-btn icon-only" title="Налаштування" aria-label="Налаштування" style="display: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </header>

  <main id="dashboardView" class="panel">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-top">
          <span class="stat-dot blue"></span>
          <span class="stat-label">Питань у базі</span>
        </div>
        <div id="statQuestions" class="stat-value">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-top">
          <span class="stat-dot green"></span>
          <span class="stat-label">Тестів у базі</span>
        </div>
        <div id="statTests" class="stat-value">0</div>
      </div>
    </div>

    <div class="btn-row">
      <button type="button" id="forceSyncBtn" class="green">Оновити базу з сервера</button>
    </div>

    <div id="syncStatus" class="status-box"></div>
  </main>

  <main id="settingsView" class="panel active">
    <section id="hintsSettingCard" class="card settings-card" style="display: none; margin-bottom: 10px;">
      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-name">Підказки</span>
          <span class="setting-desc">Підсвічувати правильні або неправильні відповіді</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="optHintsEnabled" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="divider" style="margin: 2px 0;"></div>

      <div class="setting-row">
        <div class="setting-info">
          <span class="setting-name">Показувати пройдені тести</span>
          <span class="setting-desc">Локальна позначка та максимальний бал біля тесту</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="optShowPassedTests" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <section class="card form-card">
      <div class="field">
        <label for="serverUrl">Адреса сервера (API URL)</label>
        <input type="text" id="serverUrl" placeholder="https://api.example.com" autocomplete="off">
      </div>
      <div class="divider"></div>
      <div class="field">
        <label for="apiToken">Секретний токен (Token)</label>
        <div class="input-with-action">
          <input type="password" id="apiToken" placeholder="Введіть API_TOKEN...">
          <button type="button" id="toggleTokenVis" class="ghost-mini-btn" title="Показати/приховати">👁</button>
        </div>
      </div>
      <div class="btn-row primary-row">
        <button type="button" id="connectBtn" class="green">Підключити</button>
        <button type="button" id="disconnectBtn" class="red" style="flex: 0.45; display: none;">Вийти</button>
      </div>
    </section>

    <div id="settingsStatus" class="status-box" style="display: none;"></div>
  </main>

  <script src="libs/jquery.min.js"></script>
  <script type="module" src="ui.js"></script>
</body>
</html>
